[project]
name = "agent-cookbook"
version = "0.1.0"
description = "Production-grade agent cookbook — airline customer support agent on the tau2-bench dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.50",
    "chainlit>=1.3.0",
    "langfuse>=3.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
python-preference = "only-managed"
